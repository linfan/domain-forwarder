# Domain Forwarder configuration.
#
# Every value below is the built-in default, so an omitted key keeps its
# default value and running without -c starts with all defaults.

# Proxy listen address
addr: ":8080"

# Extra diagnostics: startup configuration echo, tunnel local addresses, and
# errors from requests the client aborted after the response had started.
# The one-line request summary is always printed.
debug: false

# Add X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host to forwarded requests
add_proxy_headers: false

# Edit requests before they are forwarded. Currently only adding headers is
# supported. Applied to plain HTTP requests only: a CONNECT tunnel carries no
# HTTP request to edit. Headers are set (a same-name header from the client or
# from add_proxy_headers is overwritten) and validated at startup: names must
# be RFC 7230 tokens, values must not contain CR, LF or NUL.
edit:
  enabled: false
  add_headers:
    # X-Proxy-Name: domain-forwarder
    # X-Environment: prod

# Mirror every plain-HTTP proxy request to a second HTTP service. Delivery is
# asynchronous and best-effort: a slow, failing or overloaded mirror never
# delays or fails the original request. CONNECT tunnels are not mirrored,
# because their content is an opaque TLS stream.
#
# The mirrored copy keeps the method, headers (post-edit, hop-by-hop removed)
# and body. Its URL is target + the original path/query, its Host is the mirror
# host, and the original Host is sent in X-Forwarded-Host. Requests whose body
# exceeds max_body_bytes, or whose body the upstream never fully reads, are not
# mirrored. Memory use is bounded by queue_size * max_body_bytes.
mirror:
  enabled: false
  target: ""                     # Absolute http(s) base URL, e.g. http://127.0.0.1:9000
  timeout: 5s                    # Per-delivery timeout (connect + request + response)
  max_body_bytes: 1048576        # Capture at most 1 MiB of the request body; 0 = bodies are never mirrored
  queue_size: 256                # Pending mirror jobs; overflow is dropped silently

# Reject requests whose source IP matches an entry below with 403.
# Entries are individual IPs or CIDR ranges.
source_ip_blacklist: []
# source_ip_blacklist:
#   - 203.0.113.7
#   - 192.168.0.0/16

# Require HTTP Basic authentication from proxy clients. Unauthenticated or
# invalid requests get 407 Proxy Authentication Required with a
# Proxy-Authenticate challenge; this covers HTTP forwarding and CONNECT tunnels.
# password is either plaintext or a bcrypt hash starting with "$2"; a malformed
# hash fails startup validation. Basic credentials are only base64-encoded, so
# combine authentication with tls.enabled when the listener is on an untrusted
# network.
auth:
  enabled: false
  username: ""
  password: ""
  # username: alice
  # password: s3cret
  # password: $2y$10$...     # htpasswd -nbB alice 's3cret' | cut -d: -f2

# -----------------------------------------------------------------------------
# Forwarding engine: upstream connection pool, timeouts and streaming
# (HTTP requests and CONNECT tunnels share the dial settings below)
# -----------------------------------------------------------------------------
forward:
  buffer_size: 32768             # Copy buffer size in bytes (default: 32KB)
  max_idle_conns: 1000           # Max total idle (keep-alive) connections in the pool
  max_idle_conns_per_host: 100   # Max idle connections per upstream host
  max_conns_per_host: 0          # Max total connections per upstream host; 0 = unlimited
  idle_conn_timeout: 90s         # How long an idle connection is kept before closing
  tls_handshake_timeout: 10s     # TLS handshake timeout for upstream connections
  expect_continue_timeout: 1s    # Wait for a 100-continue before sending the request body
  response_header_timeout: 30s   # Max wait for the upstream response headers
  dial_timeout: 10s              # TCP connect timeout (HTTP and CONNECT)
  dial_keep_alive: 30s           # TCP keep-alive interval (HTTP and CONNECT)
  request_timeout: 60s           # Max wait for upstream response headers incl. dialing;
                                 # does not limit body transfer (0 = disabled)
  stream_idle_timeout: 0s        # Abort a response body that receives no bytes for this
                                 # long; 0s = disabled (e.g. 120s)
  response_body_timeout: 0s      # Total duration cap for a non-streaming response body;
                                 # 0s = disabled (e.g. 300s)
  streaming_flush: true          # Flush streaming (SSE) responses chunk by chunk
  disable_compression: true      # Never negotiate compression with the upstream, so a
                                 # compressing gateway cannot buffer SSE streams in bursts
  force_attempt_http2: true      # Attempt HTTP/2 for TLS upstream connections

# HTTP server settings for the proxy listener
server:
  read_header_timeout: 10s       # Max time to read the request headers
  idle_timeout: 120s             # How long an idle keep-alive connection is kept
  max_header_bytes: 1048576      # Max size of request headers (1MB)
  shutdown_timeout: 30s          # Grace period for in-flight requests on SIGINT/SIGTERM

# Optional file logging with size-based rotation (lumberjack).
# Enabled only when both dir and filename are set; otherwise logs go to stderr.
log:
  # dir: /var/log/domain-forwarder
  # filename: app.log
  max_size: 100                  # Max size (MB) of one log file before rotation
  max_backups: 10                # Max number of rotated files to keep

# Serve proxy clients over TLS (an HTTPS proxy). Any PEM certificate/key pair
# works; prefer a full chain (e.g. Let's Encrypt fullchain.pem) so clients
# receive the intermediate certificates. Browsers such as Chrome treat proxy
# certificate errors as fatal, so the certificate must be publicly trusted and
# its SAN must match the host name clients put in the proxy settings.
# Validation fails at startup when the pair is missing, unreadable or mismatched.
tls:
  enabled: false
  cert_file: /path/to/server.crt
  key_file: /path/to/server.key
  # Let's Encrypt:
  # cert_file: /etc/letsencrypt/live/proxy.example.com/fullchain.pem
  # key_file: /etc/letsencrypt/live/proxy.example.com/privkey.pem
