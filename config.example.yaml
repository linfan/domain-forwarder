# Domain Forwarder configuration.
#
# Every value below is the built-in default, so an omitted key keeps its
# default value and running without -c starts with all defaults.

# Proxy listen address
addr: ":8080"

# Extra diagnostics: startup configuration echo, tunnel local addresses, and
# errors from requests the client aborted after the response had started.
# The one-line request summary is always printed.
debug: false

# Add X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host to forwarded requests
add_proxy_headers: false

# Edits requests before they are forwarded. Currently only adding headers is
# supported. Headers are set (a same-name header from the client or from
# add_proxy_headers is overwritten) and validated at startup: names must be
# RFC 7230 tokens, values must not contain CR, LF or NUL. HTTPS requests are
# editable only when their CONNECT target matches a group in the mitm section.
edit:
  enabled: false
  add_headers:
    # X-Proxy-Name: domain-forwarder
    # X-Environment: prod

# Mirror every forwarded proxy request to a second HTTP service. Delivery is
# asynchronous and best-effort: a slow, failing or overloaded mirror never
# delays or fails the original request. Requests decrypted by mitm are mirrored
# too; CONNECT tunnels outside mitm groups are not, because their content is an
# opaque TLS stream.
#
# The mirrored copy keeps the method, headers (post-edit, hop-by-hop removed)
# and body. Its URL is target + the original path/query, its Host is the mirror
# host, and the original Host is sent in X-Forwarded-Host. Requests whose body
# exceeds max_body_bytes, or whose body the upstream never fully reads, are not
# mirrored. Memory use is bounded by queue_size * max_body_bytes.
mirror:
  enabled: false
  target: ""                     # Absolute http(s) base URL, e.g. http://127.0.0.1:9000
  timeout: 5s                    # Per-delivery timeout (connect + request + response)
  max_body_bytes: 1048576        # Capture at most 1 MiB of the request body; 0 = bodies are never mirrored
  queue_size: 256                # Pending mirror jobs; overflow is dropped silently

# HTTPS interception. When an HTTP/1.1 CONNECT target matches a group, the proxy
# terminates TLS locally using a certificate minted by that group's CA, applies
# add_proxy_headers / edit / mirror to the decrypted requests, then re-originates
# each one to the original target over HTTPS. CONNECT targets that match no
# group stay opaque TCP tunnels. Clients must trust the group's CA; certificate
# pinning and upstream client certificates (mTLS) are not supported. A matching
# proxy-side HTTP/2 CONNECT returns 501 and is logged with
# outcome=mitm_not_supported; HTTP/2 inside intercepted tunnels works.
#
# Minted leaves are valid for 7 days (or until the CA expires, if sooner) and are
# cached per host. A cached leaf is re-minted before it expires, so a proxy that
# runs for weeks never hands out a certificate a client rejects. Re-minting
# starts once a third of the leaf's lifetime is left, at the latest 24 hours
# before expiry.
#
# Groups are evaluated in order and the first match wins. Host patterns are "*"
# (every host), "*.example.com" (subdomains only, not the bare domain), a bare
# host name, or an IP literal; ports are ignored, so a group cannot single out
# one port: use tunnel_connect for that. A "*" group makes every later group
# unreachable, so place it last. A CONNECT authority without a port is dialed as
# port 443, for the raw upgrade relay and the plaintext fallback too.
#
# tunnel_connect entries outrank every group: a CONNECT authority listed there
# stays an opaque TCP tunnel even when a group covers its host. This is the exit
# for protocols where the server speaks first (SMTP, FTP, IMAP): the client sends
# no TLS ClientHello to sniff, so interception has nothing to decide on and the
# tunnel would only stall until forward.tls_handshake_timeout, close and log
# outcome=clienthello_timeout. An entry
# is a host pattern plus an optional port: "*:25" covers port 25 of every host,
# "*.example.com:143" one port of one domain, "legacy.example.com" every port of
# that host. Matching ignores case, userinfo, IPv6 brackets and a trailing dot,
# but not the port: an entry that names one never matches a portless authority,
# which keeps decryption strict. Every tunnel kept raw this way logs
# excluded_by="<entry>". A portless entry does match a portless authority, and
# the raw tunnel path then dials it as written, so such a CONNECT fails with 502
# instead of defaulting to 443 the way an intercepted one would.
mitm:
  enabled: false
  tunnel_connect: []             # CONNECT targets never decrypted, whatever the groups say
  # tunnel_connect:
  #   - "*:25"                   # SMTP: the server greets before the client speaks
  #   - "*:143"                  # IMAP
  #   - "legacy.example.com"     # every port of this host
  max_cached_hosts: 4096         # Leaves kept per CA; the least recently useful host is
                                 # re-minted on demand once the limit is reached. 0 = unlimited
                                 # (each cached host costs tens of kilobytes of resident memory)
  groups: []
  # groups:
  #   - name: internal
  #     ca_cert_file: /etc/domain-forwarder/mitm-internal-ca.crt
  #     ca_key_file: /etc/domain-forwarder/mitm-internal-ca.key
  #     hosts:
  #       - api.example.com
  #       - "*.internal.example.com"
  #   - name: all
  #     ca_cert_file: /etc/domain-forwarder/mitm-ca.crt
  #     ca_key_file: /etc/domain-forwarder/mitm-ca.key
  #     hosts:
  #       - "*"

# Request access control, enforced before any upstream connection is made.
# Both source_ip and target_domain accept a blacklist and a whitelist:
#   - blacklist: matching requests are rejected with 403
#   - whitelist: when non-empty, only matching requests are admitted; others
#                get 403
# An empty list imposes no restriction. When both are configured the blacklist
# is checked first, so a matching entry always denies.
access_control:
  # Client IPs: individual IPv4/IPv6 addresses or CIDR ranges.
  source_ip:
    blacklist: []
    # blacklist:
    #   - 203.0.113.7
    #   - 192.168.0.0/16
    whitelist: []
    # whitelist:
    #   - 10.0.0.0/8
  # Upstream hosts: exact host names or IP literals, matched case-insensitively.
  # The request's port is ignored, so one entry covers every port. Subdomains
  # are not implied: list each host explicitly. No scheme, port, path or
  # wildcard.
  target_domain:
    blacklist: []
    # blacklist:
    #   - metadata.internal
    whitelist: []
    # whitelist:
    #   - api.example.com
    #   - example.com
    #   - 127.0.0.1

# Require HTTP Basic authentication from proxy clients. Unauthenticated or
# invalid requests get 407 Proxy Authentication Required with a
# Proxy-Authenticate challenge; this covers HTTP forwarding and CONNECT tunnels.
# password is either plaintext or a bcrypt hash starting with "$2"; a malformed
# hash fails startup validation. Basic credentials are only base64-encoded, so
# combine authentication with tls.enabled when the listener is on an untrusted
# network.
auth:
  enabled: false
  username: ""
  password: ""
  # username: alice
  # password: s3cret
  # password: $2y$10$...     # htpasswd -nbB alice 's3cret' | cut -d: -f2

# -----------------------------------------------------------------------------
# Forwarding engine: upstream connection pool, timeouts and streaming
# (HTTP requests and CONNECT tunnels share the dial settings below)
# -----------------------------------------------------------------------------
forward:
  buffer_size: 32768             # Copy buffer size in bytes (default: 32KB)
  max_idle_conns: 1000           # Max total idle (keep-alive) connections in the pool
  max_idle_conns_per_host: 100   # Max idle connections per upstream host
  max_conns_per_host: 0          # Max total connections per upstream host; 0 = unlimited
  idle_conn_timeout: 90s         # How long an idle connection is kept before closing
  tls_handshake_timeout: 10s     # TLS handshake timeout for upstream connections. Inside an
                                 # intercepted tunnel it also bounds the wait for the client's
                                 # first ClientHello byte after 200 Connection Established; a
                                 # client that sends nothing gets that tunnel closed after this
                                 # long, logged as outcome=clienthello_timeout. A target whose
                                 # server speaks first belongs in mitm.tunnel_connect instead
                                 # (0 falls back to 10s there, it never means "unlimited").
  upstream_ca_file: ""           # PEM bundle of extra CAs trusted for upstream HTTPS, in
                                 # addition to the system trust store. Interception re-dials the
                                 # target as a TLS client, so hosts served from a private CA need
                                 # their CA here; without it they fail with 502.
  expect_continue_timeout: 1s    # Wait for a 100-continue before sending the request body
  response_header_timeout: 30s   # Max wait for the upstream response headers
  dial_timeout: 10s              # TCP connect timeout (HTTP and CONNECT)
  dial_keep_alive: 30s           # TCP keep-alive interval (HTTP and CONNECT)
  request_timeout: 60s           # Max wait for upstream response headers incl. dialing;
                                 # does not limit body transfer (0 = disabled). mitm applies it
                                 # to each decrypted request it re-originates, not to the
                                 # tunnel that carries them.
  stream_idle_timeout: 0s        # Abort a response body that receives no bytes for this
                                 # long; 0s = disabled (e.g. 120s)
  response_body_timeout: 0s      # Total duration cap for a non-streaming response body;
                                 # 0s = disabled (e.g. 300s)
  streaming_flush: true          # Flush streaming (SSE) responses chunk by chunk
  disable_compression: true      # Never negotiate compression with the upstream, so a
                                 # compressing gateway cannot buffer SSE streams in bursts
  force_attempt_http2: true      # Attempt HTTP/2 for TLS upstream connections

# HTTP server settings for the proxy listener. Intercepted tunnels serve their
# decrypted requests through these same limits: read_header_timeout bounds each
# request head inside the tunnel and idle_timeout the keep-alive gap between
# them, so a client that stops talking is dropped. What none of these bounds is a
# body that stops mid-transfer, in either direction: that is the same as an
# ordinary proxied request, so long uploads and downloads are never cut short.
server:
  read_header_timeout: 10s       # Max time to read the request headers
  idle_timeout: 120s             # How long an idle keep-alive connection is kept
  max_header_bytes: 1048576      # Max size of request headers (1MB)
  shutdown_timeout: 30s          # Grace period for in-flight requests on SIGINT/SIGTERM

# Optional file logging with size-based rotation (lumberjack).
# Enabled only when both dir and filename are set; otherwise logs go to stderr.
log:
  # dir: /var/log/domain-forwarder
  # filename: app.log
  max_size: 100                  # Max size (MB) of one log file before rotation
  max_backups: 10                # Max number of rotated files to keep

# Serve proxy clients over TLS (an HTTPS proxy). Any PEM certificate/key pair
# works; prefer a full chain (e.g. Let's Encrypt fullchain.pem) so clients
# receive the intermediate certificates. Browsers such as Chrome treat proxy
# certificate errors as fatal, so the certificate must be publicly trusted and
# its SAN must match the host name clients put in the proxy settings.
# Validation fails at startup when the pair is missing, unreadable or mismatched.
tls:
  enabled: false
  cert_file: /path/to/server.crt
  key_file: /path/to/server.key
  # Let's Encrypt:
  # cert_file: /etc/letsencrypt/live/proxy.example.com/fullchain.pem
  # key_file: /etc/letsencrypt/live/proxy.example.com/privkey.pem
